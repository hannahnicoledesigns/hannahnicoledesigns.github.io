<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern — Hannah Nicole Designs</title>
<meta name="description" content="Crochet pattern details from Hannah Nicole Designs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Hannah's editable content lives in content.js, not here. -->
<script src="content.js"></script>
<script>
  // ---------------------------------------------------------------
  // FONT LOADER — same logic as index.html, kept in sync with content.js
  // ---------------------------------------------------------------
  (function(){
    var FONT_PRESETS = {
      "Fraunces":            { google: "Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500", stack: "'Fraunces', serif" },
      "Playfair Display":    { google: "Playfair+Display:ital,wght@0,400;0,600;0,700;1,500", stack: "'Playfair Display', serif" },
      "Cormorant Garamond":  { google: "Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500", stack: "'Cormorant Garamond', serif" },
      "Nunito Sans":         { google: "Nunito+Sans:wght@400;600;700", stack: "'Nunito Sans', sans-serif" },
      "Quicksand":           { google: "Quicksand:wght@400;600;700", stack: "'Quicksand', sans-serif" },
      "Poppins":             { google: "Poppins:wght@400;500;600;700", stack: "'Poppins', sans-serif" },
      "Caveat":              { google: "Caveat:wght@500;600;700", stack: "'Caveat', cursive" },
    };
    var c = window.SITE_CONTENT || {};
    var fontChoices = c.fonts || {};
    var heading = FONT_PRESETS[fontChoices.heading] || FONT_PRESETS["Fraunces"];
    var body = FONT_PRESETS[fontChoices.body] || FONT_PRESETS["Nunito Sans"];

    var families = [heading.google];
    if (body.google !== heading.google) families.push(body.google);
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?' + families.map(function(f){ return 'family=' + f; }).join('&') + '&display=swap';
    document.head.appendChild(link);

    document.documentElement.style.setProperty('--font-heading', heading.stack);
    document.documentElement.style.setProperty('--font-body', body.stack);
  })();
</script>

<style>
  :root{
    --color1: #3B4A5A;
    --color2: #2A3644;
    --color3: #D9A441;
    --color4: #E8B8AC;
    --color5: #FBF6EE;
    --ink: #2B2B28;
    --stitch: #C8B89A;
    --font-heading: 'Fraunces', serif;
    --font-body: 'Nunito Sans', sans-serif;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html{ scroll-behavior: smooth; }
  body{
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--color5);
    line-height: 1.6;
  }
  h1, h2, h3{
    font-family: var(--font-heading);
    font-weight: 600;
    line-height: 1.1;
  }
  a{ color: inherit; }
  img{ max-width: 100%; display: block; }

  /* ---------- NAV ---------- */
  nav{
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 6vw;
    background: var(--color5);
    border-bottom: 1px solid rgba(43,43,40,0.08);
  }
  nav .brand{
    font-family: var(--font-heading);
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  nav a.back{
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--color2);
  }
  nav a.back:hover{ color: var(--color3); }

  /* ---------- PATTERN LAYOUT ---------- */
  .pattern{
    max-width: 1080px;
    margin: 0 auto;
    padding: 4rem 6vw 6rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3.5rem;
    align-items: start;
  }

  /* carousel */
  .carousel{
    position: relative;
  }
  .carousel-frame{
    position: relative;
    aspect-ratio: 1/1;
    border-radius: 6px;
    overflow: hidden;
    background: linear-gradient(135deg, var(--color1), var(--color4));
    box-shadow: 0 18px 40px rgba(43,43,40,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .carousel-frame img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .carousel-frame .placeholder-label{
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--color2);
    background: rgba(255,255,255,0.55);
    padding: 0.4rem 0.9rem;
    border-radius: 20px;
    position: relative;
    z-index: 1;
  }
  .carousel-nav{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.85);
    color: var(--color2);
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(43,43,40,0.2);
  }
  .carousel-nav:hover{ background: var(--color3); color: var(--color5); }
  .carousel-nav.prev{ left: 0.8rem; }
  .carousel-nav.next{ right: 0.8rem; }
  .carousel-dots{
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  .carousel-dots button{
    width: 0.6rem;
    height: 0.6rem;
    border-radius: 50%;
    border: none;
    background: var(--color4);
    cursor: pointer;
    padding: 0;
  }
  .carousel-dots button[aria-current="true"]{ background: var(--color3); }

  /* details */
  .pattern-details .tag{
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color1);
    margin-bottom: 0.9rem;
    display: block;
  }
  .pattern-details h1{
    font-size: clamp(2rem, 3.4vw, 2.8rem);
    color: var(--color2);
    margin-bottom: 1.2rem;
  }
  .pattern-details p{
    color: #4a4a45;
    margin-bottom: 1rem;
  }
  .pattern-links{
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem;
    margin-top: 1.6rem;
  }
  .btn{
    display: inline-block;
    padding: 0.85rem 1.8rem;
    background: var(--color3);
    color: var(--color5);
    font-weight: 700;
    text-decoration: none;
    border-radius: 3px;
    font-size: 0.95rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .btn.kofi{ background: var(--color1); }

  .social-row{
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem;
    margin-top: 2rem;
  }
  .social-row a{
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.5rem 0.95rem;
    border: 1.5px solid rgba(43,43,40,0.18);
    border-radius: 20px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--color2);
  }
  .social-row a:hover{ border-color: var(--color3); color: var(--color3); }

  .not-found{
    max-width: 640px;
    margin: 0 auto;
    padding: 6rem 6vw;
    text-align: center;
  }
  .not-found h1{ margin-bottom: 1rem; color: var(--color2); }
  .not-found p{ margin-bottom: 1.5rem; color: #4a4a45; }

  footer{
    padding: 2.2rem 6vw;
    text-align: center;
    font-size: 0.85rem;
    color: rgba(43,43,40,0.6);
    background: var(--color5);
    border-top: 1px solid rgba(43,43,40,0.08);
  }

  @media (max-width: 800px){
    .pattern{ grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; scroll-behavior: auto !important; }
  }

  a:focus-visible, .btn:focus-visible, button:focus-visible{
    outline: 3px solid var(--color3);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<nav>
  <a class="brand" href="index.html" data-content="brandName">Hannah Nicole Designs</a>
  <a class="back" href="index.html#gallery">← Back to gallery</a>
</nav>

<main id="pattern-root">
  <!-- filled in by script below, based on ?slug= in the URL -->
</main>

<footer>
  <p>&copy; <span id="year"></span> <span data-content="brandName">Hannah Nicole Designs</span> · Handmade with care</p>
</footer>

<script>
(function(){
  const c = window.SITE_CONTENT;
  const root = document.getElementById('pattern-root');
  document.getElementById('year').textContent = new Date().getFullYear();

  document.querySelectorAll('[data-content="brandName"]').forEach(el => {
    el.textContent = c.brandName;
  });

  // Colors, so this page matches whatever palette is set in content.js
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--color1', c.colors.color1);
  rootStyle.setProperty('--color2', c.colors.color2);
  rootStyle.setProperty('--color3', c.colors.color3);
  rootStyle.setProperty('--color4', c.colors.color4);
  rootStyle.setProperty('--color5', c.colors.color5);

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const pattern = (c.patterns || []).find(p => p.slug === slug);

  if (!pattern) {
    root.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'not-found';
    wrap.innerHTML = '<h1>Pattern not found</h1><p>This pattern may have moved, or the link is out of date.</p>';
    const link = document.createElement('a');
    link.className = 'btn';
    link.href = 'index.html#gallery';
    link.textContent = 'Back to the gallery';
    wrap.appendChild(link);
    root.appendChild(wrap);
    document.title = 'Pattern not found — ' + c.brandName;
    return;
  }

  document.title = pattern.title + ' — ' + c.brandName;

  const section = document.createElement('div');
  section.className = 'pattern';

  // ----- Carousel -----
  const carousel = document.createElement('div');
  carousel.className = 'carousel';

  const frame = document.createElement('div');
  frame.className = 'carousel-frame';

  const images = (pattern.images && pattern.images.length) ? pattern.images : ['images/placeholder.jpg'];
  let current = 0;

  function renderFrame(){
    frame.innerHTML = '';
    const img = document.createElement('img');
    img.src = images[current];
    img.alt = pattern.title + ' — photo ' + (current + 1) + ' of ' + images.length;
    img.onerror = function(){
      img.remove();
      const label = document.createElement('span');
      label.className = 'placeholder-label';
      label.textContent = '📷 add photo ' + (current + 1) + ' in content.js';
      frame.appendChild(label);
    };
    frame.appendChild(img);
    dots.forEach((d, i) => d.setAttribute('aria-current', i === current ? 'true' : 'false'));
  }

  const prevBtn = document.createElement('button');
  prevBtn.className = 'carousel-nav prev';
  prevBtn.setAttribute('aria-label', 'Previous photo');
  prevBtn.textContent = '‹';
  prevBtn.onclick = function(){ current = (current - 1 + images.length) % images.length; renderFrame(); };

  const nextBtn = document.createElement('button');
  nextBtn.className = 'carousel-nav next';
  nextBtn.setAttribute('aria-label', 'Next photo');
  nextBtn.textContent = '›';
  nextBtn.onclick = function(){ current = (current + 1) % images.length; renderFrame(); };

  frame.appendChild(prevBtn);
  frame.appendChild(nextBtn);
  carousel.appendChild(frame);

  const dotsWrap = document.createElement('div');
  dotsWrap.className = 'carousel-dots';
  const dots = images.map((_, i) => {
    const dot = document.createElement('button');
    dot.setAttribute('aria-label', 'Go to photo ' + (i + 1));
    dot.onclick = function(){ current = i; renderFrame(); };
    dotsWrap.appendChild(dot);
    return dot;
  });
  if (images.length > 1) carousel.appendChild(dotsWrap);
  else { prevBtn.style.display = 'none'; nextBtn.style.display = 'none'; }

  renderFrame();

  // ----- Details -----
  const details = document.createElement('div');
  details.className = 'pattern-details';

  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = 'Pattern';

  const h1 = document.createElement('h1');
  h1.textContent = pattern.title;

  details.appendChild(tag);
  details.appendChild(h1);

  (pattern.description || []).forEach(text => {
    const p = document.createElement('p');
    p.textContent = text;
    details.appendChild(p);
  });

  const links = document.createElement('div');
  links.className = 'pattern-links';

  if (pattern.etsyUrl) {
    const etsyBtn = document.createElement('a');
    etsyBtn.className = 'btn';
    etsyBtn.href = pattern.etsyUrl;
    etsyBtn.target = '_blank';
    etsyBtn.rel = 'noopener';
    etsyBtn.textContent = 'Get the pattern on Etsy →';
    links.appendChild(etsyBtn);
  }
  if (pattern.kofiUrl) {
    const kofiBtn = document.createElement('a');
    kofiBtn.className = 'btn kofi';
    kofiBtn.href = pattern.kofiUrl;
    kofiBtn.target = '_blank';
    kofiBtn.rel = 'noopener';
    kofiBtn.textContent = 'Get it on Ko-fi →';
    links.appendChild(kofiBtn);
  }
  details.appendChild(links);

  // Socials — Etsy + Ko-fi again as text links, TikTok + Instagram to follow along
  if (c.socials) {
    const socialRow = document.createElement('div');
    socialRow.className = 'social-row';
    Object.keys(c.socials).forEach(key => {
      const s = c.socials[key];
      if (!s || !s.url) return;
      const a = document.createElement('a');
      a.href = s.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = s.label + ' ' + s.handle;
      socialRow.appendChild(a);
    });
    details.appendChild(socialRow);
  }

  section.appendChild(carousel);
  section.appendChild(details);
  root.appendChild(section);
})();
</script>

</body>
</html>
